<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移动端书签卡片 · 列表、双列与三列</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.446z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2c2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2a4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6c-.6.6-.6 1.2-.5 2V21"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  </svg>
  <header class="navbar" aria-label="页面导航">
    <div class="brand"><img src="../../images/logo.svg" alt=""><span>BMM</span></div>
    <div class="nav-actions">
      <button class="nav-action" aria-label="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
      <button class="nav-action" aria-label="项目地址"><svg class="icon"><use href="#i-github"/></svg></button>
      <button class="nav-action" aria-label="个人中心"><svg class="icon"><use href="#i-user"/></svg></button>
      <button class="nav-action" aria-label="展开菜单"><svg class="icon"><use href="#i-menu"/></svg></button>
    </div>
  </header>
  <main class="main">
    <section class="collection-heading">
      <h1>开发与灵感</h1>
      <p>12 个相关书签 · 3 个关联标签</p>
      <div class="tag-list" aria-label="相关标签"><span class="tag">开发</span><span class="tag">设计</span><span class="tag">AI</span></div>
    </section>
    <section id="bookmark-grid" class="bookmark-grid layout-list" aria-label="书签列表">
      <a class="bookmark-card" href="https://github.com" title="GitHub"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/github.png" alt=""></span><h2 class="bookmark-title">GitHub</h2></a>
      <a class="bookmark-card" href="https://www.figma.com" title="Figma"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/figma.png" alt=""></span><h2 class="bookmark-title">Figma</h2></a>
      <a class="bookmark-card" href="https://www.notion.so" title="Notion"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/notion.png" alt=""></span><h2 class="bookmark-title">Notion</h2></a>
      <a class="bookmark-card" href="https://chatgpt.com" title="ChatGPT"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/chatgpt.png" alt=""></span><h2 class="bookmark-title">ChatGPT</h2></a>
      <a class="bookmark-card" href="https://developer.mozilla.org" title="MDN Web Docs"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/mdn.png" alt=""></span><h2 class="bookmark-title">MDN Web Docs</h2></a>
      <a class="bookmark-card" href="https://vercel.com" title="Vercel"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/vercel.png" alt=""></span><h2 class="bookmark-title">Vercel</h2></a>
      <a class="bookmark-card" href="https://tailwindcss.com" title="Tailwind CSS"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/tailwind.png" alt=""></span><h2 class="bookmark-title">Tailwind CSS</h2></a>
      <a class="bookmark-card" href="https://linear.app" title="Linear"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/linear.png" alt=""></span><h2 class="bookmark-title">Linear</h2></a>
      <a class="bookmark-card" href="https://dribbble.com" title="Dribbble"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/dribbble.png" alt=""></span><h2 class="bookmark-title">Dribbble</h2></a>
      <a class="bookmark-card" href="https://www.cloudflare.com" title="Cloudflare"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/cloudflare.png" alt=""></span><h2 class="bookmark-title">Cloudflare</h2></a>
      <a class="bookmark-card" href="https://aistudio.google.com" title="Google AI Studio"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/googleai.png" alt=""></span><h2 class="bookmark-title">Google AI Studio</h2></a>
      <a class="bookmark-card" href="https://www.tongyi.com" title="通义千问"><span class="favicon-wrap"><img class="favicon" src="assets/favicons/qwen.png" alt=""></span><h2 class="bookmark-title">通义千问</h2></a>
    </section>
    <div class="end-note">已经到底啦</div>
  </main>
  <script src="cards.js"></script>
</body>
</html>
