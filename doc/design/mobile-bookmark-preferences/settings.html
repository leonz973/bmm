<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>偏好设置 · 书签显示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.446z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2c2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2a4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6c-.6.6-.6 1.2-.5 2V21"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-mobile" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4m-3 14h2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-saved" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  </svg>
  <header class="navbar" aria-label="页面导航">
    <div class="brand"><img src="../../images/logo.svg" alt=""><span>BMM</span></div>
    <div class="nav-actions">
      <button class="nav-action" aria-label="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
      <button class="nav-action" aria-label="项目地址"><svg class="icon"><use href="#i-github"/></svg></button>
      <button class="nav-action" aria-label="个人中心"><svg class="icon"><use href="#i-user"/></svg></button>
      <button class="nav-action" aria-label="展开菜单"><svg class="icon"><use href="#i-menu"/></svg></button>
    </div>
  </header>
  <main class="settings-main">
    <div class="page-title"><span class="title-icon"><svg class="icon"><use href="#i-sliders"/></svg></span><h1>偏好设置</h1></div>
    <section class="settings-section" aria-labelledby="display-heading">
      <div class="section-heading"><svg class="icon"><use href="#i-mobile"/></svg><h2 id="display-heading">书签显示</h2></div>
      <p class="section-description">默认保留原列表，可切换为紧凑卡片。<br>仅影响移动端，桌面布局保持不变。</p>
      <fieldset class="layout-options">
        <legend class="sr-only">移动端书签列数</legend>
        <label class="layout-option selected">
          <input type="radio" name="layout" value="list" checked>
          <span class="option-content">
            <span class="selected-check"><svg class="icon"><use href="#i-check"/></svg></span>
            <span class="mini-grid list" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="option-name">列表</span>
            <span class="option-note">默认 · 原样式</span>
          </span>
        </label>
        <label class="layout-option">
          <input type="radio" name="layout" value="2">
          <span class="option-content">
            <span class="mini-grid two" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="option-name">双列</span>
            <span class="option-note">清晰易读</span>
          </span>
        </label>
        <label class="layout-option">
          <input type="radio" name="layout" value="3">
          <span class="option-content">
            <span class="mini-grid three" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="option-name">三列</span>
            <span class="option-note">紧凑高效</span>
          </span>
        </label>
      </fieldset>
      <div class="save-state"><svg class="icon"><use href="#i-saved"/></svg><span>选择后自动保存</span></div>
    </section>
    <div class="section-heading profile-heading"><svg class="icon"><use href="#i-user"/></svg><h2>个人资料</h2></div>
    <section class="profile" aria-label="个人资料编辑入口">
      <div class="avatar" aria-hidden="true">川</div>
      <div><div class="profile-name">令川</div><div class="profile-email">管理昵称与头像</div></div>
    </section>
  </main>
</body>
</html>
