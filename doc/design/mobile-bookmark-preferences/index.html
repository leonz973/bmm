<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMM 移动端书签卡片与显示偏好 · 方案总览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sheet-body">
  <main class="sheet">
    <header class="sheet-header">
      <div><div class="sheet-kicker">BMM · 移动端书签浏览体验</div><h1>一屏找到，一点即达</h1></div>
      <div class="sheet-badge">默认原列表 · 紧凑布局可选 · 390 × 844</div>
    </header>
    <div class="screen-row">
      <section class="screen-item">
        <div class="screen-label"><h2>列表 · 默认</h2><p>保持原样式</p></div>
        <div class="phone"><img src="assets/screens/list-default.png" alt="移动端默认列表设计稿"></div>
      </section>
      <section class="screen-item">
        <div class="screen-label"><h2>双列 · 可选</h2><p>更清晰</p></div>
        <div class="phone"><img src="assets/screens/two-columns.png" alt="移动端双列书签设计稿"></div>
      </section>
      <section class="screen-item">
        <div class="screen-label"><h2>三列 · 紧凑模式</h2><p>更高密度</p></div>
        <div class="phone"><img src="assets/screens/three-columns.png" alt="移动端三列书签设计稿"></div>
      </section>
      <section class="screen-item">
        <div class="screen-label"><h2>偏好设置</h2><p>即时生效</p></div>
        <div class="phone"><img src="assets/screens/preferences.png" alt="移动端显示偏好设计稿"></div>
      </section>
    </div>
    <div class="sheet-notes">
      <div class="sheet-note"><strong>原列表保持不变</strong>继续展示标题、描述与标签；未设置偏好时不改变现有浏览体验。</div>
      <div class="sheet-note"><strong>标题最多两行</strong>适合中英文混排与较长站点名称，减少识别时的猜测。</div>
      <div class="sheet-note"><strong>短标题单行省略</strong>以熟悉图标加快扫视；完整名称保留在辅助说明中。</div>
      <div class="sheet-note"><strong>选择后自动保存</strong>只调整移动端卡片密度，不影响桌面、标签与筛选。</div>
    </div>
  </main>
</body>
</html>
